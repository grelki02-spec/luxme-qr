<script>

fetch("data.json")

.then(res => res.json())

.then(data => {

document.getElementById("title").innerText =
data.title;

document.getElementById("desc").innerText =
data.description;

function fill(id,array){

let el =
document.getElementById(id);

el.innerHTML="";

if(!array) return;

array.forEach(item=>{

el.innerHTML +=
`<div class="item">${item}</div>`;

});

}

fill(
"restaurant",
data.main_restaurant
);

fill(
"food",
data.food_court
);

fill(
"alacarte",
data.alacarte
);

fill(
"bars",
data.bars
);

fill(
"services",
data.services
);

fill(
"wellness",
data.wellness
);

document.getElementById(
"note"
).innerText =
data.note || "";

document.getElementById(
"contact"
).innerHTML =

`Contact us via WhatsApp:
<a href="https://wa.me/${data.whatsapp}">
${data.phone}
</a>`;

document.getElementById(
"roomphone"
).innerText =

data.room_phone || "";

})

.catch(error => {

console.log(
"Error:",
error
);

});

</script>
