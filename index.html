<script>

fetch("./data.json")

.then(function(response){

return response.json();

})

.then(function(data){

document.getElementById("title").textContent =
data.title || "";

document.getElementById("desc").textContent =
data.description || "";

function fill(id,items){

var container =
document.getElementById(id);

if(!container)return;

container.innerHTML="";

(items||[]).forEach(function(item){

var row =
document.createElement("div");

row.className="item";

row.textContent=item;

container.appendChild(row);

});

}

fill("restaurant",data.main_restaurant);

fill("food",data.food_court);

fill("alacarte",data.alacarte);

fill("bars",data.bars);

fill("services",data.services);

fill("wellness",data.wellness);

document.getElementById("note").textContent =
data.note || "";

document.getElementById("contact").innerHTML =

'Contact us via WhatsApp: <a href="https://wa.me/' +
(data.whatsapp||"") +
'">' +
(data.phone||"") +
'</a>';

document.getElementById("roomphone").textContent =

data.room_phone || "";

})

.catch(function(err){

document.body.innerHTML =
"<h3 style='text-align:center'>Error loading data.json</h3>";

console.log(err);

});

</script>
