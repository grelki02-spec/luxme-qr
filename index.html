<script>

fetch("data.json")

.then(function(res){
return res.json();
})

.then(function(data){

document.getElementById("title").innerText=
data.title || "";

document.getElementById("desc").innerText=
data.description || "";

function fill(id,items){

var el=
document.getElementById(id);

el.innerHTML="";

if(!items)return;

items.forEach(function(item){

el.innerHTML +=
'<div class="item">'+
item+
'</div>';

});

}

fill(
"restaurant",
data.main_restaurant
);

fill(
"food",
data.food_court
);

fill(
"alacarte",
data.alacarte
);

fill(
"bars",
data.bars
);

fill(
"services",
data.services
);

fill(
"wellness",
data.wellness
);

document.getElementById(
"note"
).innerText=
data.note || "";

document.getElementById(
"contact"
).innerHTML=

'Contact us via WhatsApp: <a href="https://wa.me/' +
data.whatsapp +
'">' +
data.phone +
'</a>';

document.getElementById(
"roomphone"
).innerText=

data.room_phone || "";

})

.catch(function(error){

console.log(error);

});

</script>
